<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  </head>
  <style>
   #dropzone-external {
    width: 100%;
    height: 150px;
    background-color: #FFDEE5;  
    padding: 10px;
    border: 2px dashed #FFAABC;
    border-radius: 14px;
}

#dropzone-external > * {
  pointer-events: none;
}

#dropzone-external.dropzone-active {
  border-style: solid;
}

.widget-container > span {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 16px;
}

#dropzone-image {
  max-width: 100%;
  max-height: 100%;
}

#dropzone-text > span {
  font-weight: 100;
  opacity: 0.5;
}

#upload-progress {
  display: flex;
  margin-top: 10px;
}

.flex-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.dx-fileuploader-input-wrapper {
    display: none;
}
.dx-fileuploader-file {
    display: none;
}
.emialInput{
    border: 2px solid #6F6E6E;
    height: 53px;
    border-radius: 15px;
    padding: 0.375rem 1.75rem;
    margin-bottom: 40px !important;
}
.form-check-input:checked {
    background-color: #FF5175;
    border-color: #FF5175;
}
  </style>
  <body>
    <div>
    <div class="row justify-content-center " style="margin-top: 40px ">
        <div class="col-md-3 p-3">
            <img style="display: block;margin: auto;" src="image 112.png">
            <h3 class="text-center mt-4 " style="font-size: 30px;font-weight: 700;">Upload Your Video</h3>
            <p  class="text-center " style="font-size: 18px;margin-bottom: 25px">The video will be used in social media and/or the Thinx website.</p>
           
            <div class="demo-container">
                <div class="widget-container flex-box">
                  <div id="dropzone-external" class="flex-box dx-theme-border-color">
                    <img id="dropzone-image" src="#" hidden alt="" />
                    <div id="dropzone-text" class="flex-box">
                        <h3  style="font-size: 29px;font-weight: 700;color: #FF5175;">Drag & Drop or Browse</h3>
                        <p style="font-size: 15px;margin-bottom: 0;">Upload formats: MP4 (Up to 500 MB)</p>
                    </div>
                    <div id="upload-progress"></div>
                  </div>
                  <div id="file-uploader"></div>
                </div>
              </div>
              <p class=" mt-4 mb-2" style="font-size: 15px;margin-left: 20px;">Enter your address mail so we can send you the gift card:</p>
              
              <input type="email" class="form-control emialInput mt-3 " id="exampleFormControlInput1" placeholder="name@example.com">
              <div class="form-check mt-4 ">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                <label class="form-check-label" for="flexCheckChecked" style="font-size: 13px;">
                    I accept that Thinx may use my video in social medias or in his website
                </label>
              </div>
              <button class="btn btn-primary mt-4" type="button" style="    width: 100%;font-size: 20px;font-weight: 600;background: #FF5175;border: none;">Save</button>
              <div style="display: flex;justify-content: center;" class="mt-4">
                 <h5>Powered by </h5>
                 <div style="margin-left: 10px;" >
                    <img src="vidialLogo.png">
                </div>
                 <h5>idial</h5> 
              </div>
        </div>  
    </div>
</div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>window.jQuery || document.write(decodeURIComponent('%3Cscript src="js/jquery.min.js"%3E%3C/script%3E'))</script>
<script src="https://cdn3.devexpress.com/jslib/22.2.3/js/dx.all.js"></script>
    <script>
        $(() => {
  $('#file-uploader').dxFileUploader({
    dialogTrigger: '#dropzone-external',
    dropZone: '#dropzone-external',
    multiple: false,
    allowedFileExtensions: ['.jpg', '.jpeg', '.gif', '.png'],
    uploadMode: 'instantly',
    uploadUrl: 'https://js.devexpress.com/Demos/NetCore/FileUploader/Upload',
    visible: false,
    onDropZoneEnter(e) {
      if (e.dropZoneElement.id === 'dropzone-external') { toggleDropZoneActive(e.dropZoneElement, true); }
    },
    onDropZoneLeave(e) {
      if (e.dropZoneElement.id === 'dropzone-external') { toggleDropZoneActive(e.dropZoneElement, false); }
    },
    onUploaded(e) {
      const { file } = e;
      const dropZoneText = document.getElementById('dropzone-text');
      const fileReader = new FileReader();
      fileReader.onload = function () {
        toggleDropZoneActive(document.getElementById('dropzone-external'), false);
        const dropZoneImage = document.getElementById('dropzone-image');
        dropZoneImage.src = fileReader.result;
      };
      fileReader.readAsDataURL(file);
      dropZoneText.style.display = 'none';
      uploadProgressBar.option({
        visible: false,
        value: 0,
      });
    },
    onProgress(e) {
      uploadProgressBar.option('value', (e.bytesLoaded / e.bytesTotal) * 100);
    },
    onUploadStarted() {
      toggleImageVisible(false);
      uploadProgressBar.option('visible', true);
    },
  });

  const uploadProgressBar = $('#upload-progress').dxProgressBar({
    min: 0,
    max: 100,
    width: '30%',
    showStatus: false,
    visible: false,
  }).dxProgressBar('instance');

  function toggleDropZoneActive(dropZone, isActive) {
    if (isActive) {
      dropZone.classList.add('dx-theme-accent-as-border-color');
      dropZone.classList.remove('dx-theme-border-color');
      dropZone.classList.add('dropzone-active');
    } else {
      dropZone.classList.remove('dx-theme-accent-as-border-color');
      dropZone.classList.add('dx-theme-border-color');
      dropZone.classList.remove('dropzone-active');
    }
  }

  function toggleImageVisible(visible) {
    const dropZoneImage = document.getElementById('dropzone-image');
    dropZoneImage.hidden = !visible;
  }

  document.getElementById('dropzone-image').onload = function () { toggleImageVisible(true); };
});
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
  </body>
</html>
